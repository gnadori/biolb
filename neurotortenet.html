      <div id="eraTabs" class="flex flex-wrap gap-1.5 p-1 bg-black/40 rounded-xl border border-white/10 text-xs font-medium"></div>

  <!-- Fő tartalom -->

    <!-- Korszak leíró sáv -->
    <div class="relative overflow-hidden rounded-2xl border p-6 sm:p-7 backdrop-blur-md transition-all duration-700 bg-[var(--panel-era)] border-[var(--border-era)] shadow-2xl">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <div class="flex items-center gap-2 mb-1.5">
            <span id="eraBadge" class="px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-white/10 text-[var(--accent-era)]"></span>

          </div>
          <h2 id="eraTitle" class="text-2xl sm:text-3xl font-serif font-medium text-stone-100"></h2>

          <button id="btnNext" class="px-4 py-2 rounded-lg border border-white/10 hover:border-white/30 hover:bg-white/5 text-xs font-mono transition-all">Következő →</button>

                class="era-nav-btn px-3 py-1.5 rounded-lg transition-all duration-300 text-stone-400 hover:text-stone-100 hover:bg-white/5">
          ${era.name}
        </button>
      `).join('');
    }

          <div onclick="selectMilestone(${index})"
               id="card-${index}"
               class="milestone-card min-w-[230px] max-w-[230px] p-3 rounded-xl border border-white/10 bg-black/30 hover:border-white/30 cursor-pointer transition-all duration-300 shrink-0 snap-start flex flex-col justify-between group">
            <div>
              <div class="relative w-full h-32 rounded-lg overflow-hidden mb-2.5 bg-stone-900 border border-white/5">
                <img id="thumb-${index}" 
                     src="${item.figureUrl}" 
                     alt="${item.title}" 
                     class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                     loading="lazy">
                <span class="absolute bottom-2 left-2 text-[10px] font-mono px-2 py-0.5 rounded bg-black/80 backdrop-blur-sm text-stone-300 border border-white/10">
                  ${item.year}
                </span>
              </div>
              <h4 class="text-xs font-serif font-medium text-stone-200 line-clamp-2 leading-snug group-hover:text-white transition-colors">
                ${item.title}
              </h4>
            </div>
            <div class="mt-2.5 pt-2 border-t border-white/5 flex items-center justify-between text-[11px] font-mono text-stone-400">
              <span class="truncate mr-2">${item.scientist.split('&')[0]}</span>
              <span class="text-[var(--accent-era)] group-hover:translate-x-0.5 transition-transform">→</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleImage(index) {
      showPortraitState[index] = !showPortraitState[index];
      renderDetail(index);
    }

    function renderDetail(index) {
      const m = MILESTONES[index];
      const era = ERAS[m.era];
      const isPortrait = !!showPortraitState[index];

      const currentImgSrc = isPortrait ? m.portraitUrl : m.figureUrl;
      const currentCaption = isPortrait ? m.portraitLabel : m.figureLabel;
      const switchButtonText = isPortrait ? "← Váltás a kísérleti ábrára" : "Kattintson ide a tudós portréjáért →";

      const detail = document.getElementById('detailPanel');
      detail.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
          
          <!-- Képmegjelenítő kártya kattintási váltással -->
          <div class="lg:col-span-5 flex flex-col gap-3">
            <div onclick="toggleImage(${index})" 
                 title="Kattintson a képváltáshoz"
                 class="group relative rounded-xl overflow-hidden border border-white/15 bg-black/60 shadow-2xl cursor-pointer aspect-[4/3] flex items-center justify-center">
              <img src="${currentImgSrc}" 
                   alt="${currentCaption}" 
                   class="w-full h-full object-contain p-1 transition-transform duration-300 group-hover:scale-[1.02]">
              
              <!-- Átmenetes alsó sáv felirattal -->
              <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/95 via-black/70 to-transparent p-3 pt-6 flex flex-col justify-end">
                <span class="text-[11px] font-mono text-[var(--accent-era)] font-semibold uppercase tracking-wider mb-0.5">
                  ${isPortrait ? "Portré" : "Kísérleti ábra / dokumentum"}
                </span>
                <p class="text-xs text-stone-200 line-clamp-2">${currentCaption}</p>
              </div>

              <!-- Kattintási segítség jelvény -->
              <div class="absolute top-2.5 right-2.5 px-2 py-1 rounded-md bg-black/75 border border-white/20 text-[10px] font-mono text-stone-300 backdrop-blur-sm group-hover:bg-white/20 transition-colors">
                Kattintson a váltáshoz
              </div>
            </div>

            <!-- Kifejezett váltógomb és tudósnév -->
            <div class="flex items-center justify-between px-1">
              <button onclick="toggleImage(${index})" 
                      class="text-xs font-mono text-[var(--accent-era)] hover:underline flex items-center gap-1.5 transition-all">
                <span>⇄</span> ${switchButtonText}
              </button>
              <span class="text-xs font-mono text-stone-400">${m.scientist}</span>
            </div>
          </div>

          <!-- Leírás és tudományos részletek -->
          <div class="lg:col-span-7 space-y-5">
            <div>
              <span class="text-xs font-mono tracking-wider uppercase text-[var(--accent-era)]">${era.name} · ${m.year}</span>
              <h3 class="text-2xl sm:text-3xl font-serif font-semibold text-stone-100 mt-1">${m.title}</h3>
              <p class="text-sm font-mono text-stone-400 mt-1">Kutató: ${m.scientist}</p>
            </div>

            <div class="space-y-3.5 text-stone-300 leading-relaxed text-sm sm:text-base">
              <div class="p-4 rounded-xl bg-black/30 border border-white/10">
                <h5 class="text-xs font-mono uppercase tracking-wider text-stone-400 mb-1">Módszertan és kísérleti berendezés</h5>
                <p class="text-stone-200">${m.methodology}</p>
              </div>

              <div class="p-4 rounded-xl bg-black/30 border border-white/10">
                <h5 class="text-xs font-mono uppercase tracking-wider text-stone-400 mb-1">Tudományos áttörés</h5>
                <p class="text-stone-200">${m.breakthrough}</p>
              </div>

              <!-- Csak dőlt szöveg, idézőjelek nélkül -->
              <div class="border-l-2 border-[var(--accent-era)] pl-4 py-2 italic font-serif text-base text-stone-300 bg-white/5 rounded-r-lg">
                ${m.quoteNote}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function selectMilestone(index) {
      currentMilestoneIndex = index;
      const m = MILESTONES[index];
      const era = ERAS[m.era];

      // Korszakháttér frissítése
      const body = document.getElementById('appBody');
      body.className = `${era.className} text-stone-200 min-h-screen bg-[var(--bg-era)] flex flex-col justify-between selection:bg-amber-500/30 selection:text-amber-200`;

      // Korszak összefoglaló kártya
      document.getElementById('eraBadge').innerText = era.name;
      document.getElementById('eraDateRange').innerText = era.period;
      document.getElementById('eraTitle').innerText = m.title;
      document.getElementById('eraDesc').innerText = era.desc;

      // Felső fülek aktív stílusa
      document.querySelectorAll('.era-nav-btn').forEach(btn => {
        const isCurrent = btn.getAttribute('data-era') === m.era;
        btn.classList.toggle('bg-white/15', isCurrent);
        btn.classList.toggle('text-white', isCurrent);
        btn.classList.toggle('font-semibold', isCurrent);
      });

      // Kártyák kijelölése
      document.querySelectorAll('.milestone-card').forEach((card, idx) => {
        const isSelected = idx === index;
        card.classList.toggle('border-[var(--accent-era)]', isSelected);
        card.classList.toggle('bg-white/10', isSelected);
        card.classList.toggle('scale-[1.02]', isSelected);
      });

      // Részletes panel renderelése
      renderDetail(index);

      // Kártya görgetése a látótérbe
      const activeCard = document.getElementById(`card-${index}`);
      if (activeCard) {
        activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    function selectEra(eraKey) {
      const targetIndex = MILESTONES.findIndex(m => m.era === eraKey);
      if (targetIndex !== -1) {
        selectMilestone(targetIndex);
      }
    }

    document.getElementById('btnPrev').addEventListener('click', () => {
      const newIndex = (currentMilestoneIndex - 1 + MILESTONES.length) % MILESTONES.length;
      selectMilestone(newIndex);
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      const newIndex = (currentMilestoneIndex + 1) % MILESTONES.length;
      selectMilestone(newIndex);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        const newIndex = (currentMilestoneIndex + 1) % MILESTONES.length;
        selectMilestone(newIndex);
      } else if (e.key === 'ArrowLeft') {
        const newIndex = (currentMilestoneIndex - 1 + MILESTONES.length) % MILESTONES.length;
        selectMilestone(newIndex);
      }
    });

    // Indítás
    initEraTabs();
    initTimelineTrack();
    selectMilestone(0);
  </script>
</body>
</html>
